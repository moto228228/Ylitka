<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>🐌 Улитка-Уборщик</title>
<meta name="description" content="Мини-игра: управляйте улиткой и собирайте мусор за 60 секунд">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(#87CEEB, #E0F6FF);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    gap: 8px;
  }
  #hud {
    display: flex;
    gap: 14px;
    font-size: 18px;
    font-weight: bold;
    color: #2d4a1a;
    background: rgba(255,255,255,0.85);
    padding: 8px 18px;
    border-radius: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    white-space: nowrap;
  }
  #hud span { color: #4a7c2a; }
  canvas {
    border: 4px solid #4a7c2a;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    background: #a8d86b;
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 120px);
    touch-action: none;
  }
  /* Джойстик */
  #joystick {
    position: fixed;
    bottom: 24px;
    left: 24px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: 3px solid rgba(74,124,42,0.5);
    display: none;
    z-index: 5;
    touch-action: none;
  }
  #joystick.active { display: block; }
  #stick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #8fd14f, #4a7c2a);
    border: 3px solid #2d4a1a;
    transform: translate(-50%, -50%);
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  }
  /* Модалка конца игры */
  #gameOver {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(255,255,255,0.97);
    padding: 26px 36px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: transform 0.3s ease;
    z-index: 20;
    max-width: 90vw;
  }
  #gameOver.show { transform: translate(-50%, -50%) scale(1); }
  #gameOver h2 { margin: 0 0 10px; color: #4a7c2a; font-size: 26px; }
  #gameOver p { margin: 6px 0; font-size: 17px; color: #333; }
  #gameOver button {
    margin-top: 16px;
    padding: 12px 28px;
    font-size: 18px;
    background: #4a7c2a;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
    font-weight: bold;
  }
  #gameOver button:active { background: #5f9a37; }
  @media (hover: hover) {
    #gameOver button:hover { background: #5f9a37; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    🏆 Очки: <span id="score">0</span>
    ⏱️ Время: <span id="time">60</span>
  </div>
  <canvas id="game" width="800" height="500"></canvas>
</div>

<div id="joystick"><div id="stick"></div></div>

<div id="gameOver">
  <h2>⏰ Время вышло!</h2>
  <p>Собрано мусора: <strong id="finalScore">0</strong></p>
  <button onclick="restart()">Играть снова</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const snail = { x: W/2, y: H/2, r: 22, speed: 3.2, angle: 0, trail: [] };
let trash = [], score = 0, timeLeft = 60, lastTime = 0, running = true;
let keys = {};

// Вектор от джойстика (0..1)
let joyVec = { x: 0, y: 0, active: false };

// ====== АДАПТАЦИЯ CANVAS ПОД ЭКРАН ======
function resizeCanvas() {
  const wrap = document.getElementById('wrap');
  const hudH = 60;
  const availW = wrap.clientWidth - 8;
  const availH = wrap.clientHeight - hudH - 16;
  const ratio = W / H;
  let cw = availW, ch = cw / ratio;
  if (ch > availH) { ch = availH; cw = ch * ratio; }
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));

// ====== ОПРЕДЕЛЕНИЕ УСТРОЙСТВА ======
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (isTouch) {
  document.getElementById('joystick').classList.add('active');
}

// ====== СПАВН МУСОРА ======
const TRASH_TYPES = ['banana', 'can', 'bottle', 'paper', 'apple'];
function spawnTrash() {
  trash.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 14,
    type: TRASH_TYPES[Math.floor(Math.random() * TRASH_TYPES.length)],
    wobble: Math.random() * Math.PI * 2
  });
}

// ====== КЛАВИАТУРА ======
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))
    e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ====== ДЖОЙСТИК ======
const joyEl = document.getElementById('joystick');
const stickEl = document.getElementById('stick');
let joyCenter = { x: 0, y: 0 };
let joyTouchId = null;
const MAX_R = 45;

function setStick(dx, dy) {
  const len = Math.hypot(dx, dy);
  const clamped = Math.min(len, MAX_R);
  const nx = len > 0 ? dx / len : 0;
  const ny = len > 0 ? dy / len : 0;
  stickEl.style.transform = `translate(calc(-50% + ${nx * clamped}px), calc(-50% + ${ny * clamped}px))`;
  joyVec.x = (nx * clamped) / MAX_R;
  joyVec.y = (ny * clamped) / MAX_R;
  joyVec.active = clamped > 6;
}

function resetStick() {
  stickEl.style.transform = 'translate(-50%, -50%)';
  joyVec = { x: 0, y: 0, active: false };
  joyTouchId = null;
}

function getJoyCenter() {
  const r = joyEl.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

joyEl.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joyCenter = getJoyCenter();
  setStick(t.clientX - joyCenter.x, t.clientY - joyCenter.y);
}, { passive: false });

joyEl.addEventListener('touchmove', e => {
  e.preventDefault();
  if (joyTouchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) {
      setStick(t.clientX - joyCenter.x, t.clientY - joyCenter.y);
    }
  }
}, { passive: false });

function endJoyTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) resetStick();
  }
}
joyEl.addEventListener('touchend', endJoyTouch);
joyEl.addEventListener('touchcancel', endJoyTouch);

// Для мыши (десктоп с джойстиком, если понадобится)
joyEl.addEventListener('mousedown', e => {
  e.preventDefault();
  joyCenter = getJoyCenter();
  setStick(e.clientX - joyCenter.x, e.clientY - joyCenter.y);
  const onMove = ev => setStick(ev.clientX - joyCenter.x, ev.clientY - joyCenter.y);
  const onUp = () => {
    resetStick();
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
});

// ====== ОБНОВЛЕНИЕ ======
function update(dt) {
  if (!running) return;

  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a'] || keys['ф']) dx -= 1;
  if (keys['arrowright'] || keys['d'] || keys['в']) dx += 1;
  if (keys['arrowup'] || keys['w'] || keys['ц']) dy -= 1;
  if (keys['arrowdown'] || keys['s'] || keys['ы']) dy += 1;

  if (joyVec.active) {
    dx += joyVec.x;
    dy += joyVec.y;
  }

  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    snail.x += dx * snail.speed * 60 * dt;
    snail.y += dy * snail.speed * 60 * dt;
    snail.angle = Math.atan2(dy, dx) + Math.PI / 2;
    snail.trail.push({ x: snail.x, y: snail.y, life: 1 });
    if (snail.trail.length > 60) snail.trail.shift();
  }

  snail.x = Math.max(snail.r, Math.min(W - snail.r, snail.x));
  snail.y = Math.max(snail.r, Math.min(H - snail.r, snail.y));

  for (let i = snail.trail.length - 1; i >= 0; i--) {
    snail.trail[i].life -= dt * 0.6;
    if (snail.trail[i].life <= 0) snail.trail.splice(i, 1);
  }

  for (let i = trash.length - 1; i >= 0; i--) {
    const t = trash[i];
    t.wobble += dt * 3;
    const dist = Math.hypot(t.x - snail.x, t.y - snail.y);
    if (dist < snail.r + t.r) {
      trash.splice(i, 1);
      score++;
      document.getElementById('score').textContent = score;
      if (trash.length < 8) spawnTrash();
    }
  }

  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; endGame(); }
  document.getElementById('time').textContent = Math.ceil(timeLeft);
}

// ====== ОТРИСОВКА ======
function drawBackground() {
  ctx.fillStyle = '#a8d86b';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(140, 195, 75, 0.5)';
  for (let x = 0; x < W; x += 30)
    for (let y = 0; y < H; y += 30)
      if ((x/30 + y/30) % 2 === 0) ctx.fillRect(x, y, 30, 30);
}

function drawTrail() {
  for (const p of snail.trail) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8 * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 220, 255, ${0.4 * p.life})`;
    ctx.fill();
  }
}

function drawTrash(t) {
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(Math.sin(t.wobble) * 0.15);
  switch (t.type) {
    case 'banana':
      ctx.fillStyle = '#FFD93B';
      ctx.beginPath();
      ctx.arc(0, 0, t.r, 0.2, Math.PI - 0.2);
      ctx.arc(0, -2, t.r * 0.7, Math.PI - 0.2, 0.2, true);
      ctx.fill();
      ctx.strokeStyle = '#C7A200'; ctx.lineWidth = 2; ctx.stroke();
      break;
    case 'can':
      ctx.fillStyle = '#C0C0C0';
      ctx.fillRect(-8, -12, 16, 24);
      ctx.fillStyle = '#E8342A';
      ctx.fillRect(-8, -6, 16, 8);
      ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-8, -12, 16, 24);
      break;
    case 'bottle':
      ctx.fillStyle = 'rgba(100, 200, 150, 0.85)';
      ctx.fillRect(-6, -10, 12, 20);
      ctx.fillRect(-3, -16, 6, 6);
      ctx.strokeStyle = '#3a8a5a'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-6, -10, 12, 20);
      break;
    case 'paper':
      ctx.fillStyle = '#F5F5DC';
      ctx.beginPath();
      ctx.moveTo(-10, -10); ctx.lineTo(8, -12); ctx.lineTo(10, 8);
      ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#999'; ctx.lineWidth = 1; ctx.stroke();
      ctx.strokeStyle = '#bbb';
      ctx.beginPath(); ctx.moveTo(-5, -3); ctx.lineTo(5, -4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-5, 2); ctx.lineTo(4, 1); ctx.stroke();
      break;
    case 'apple':
      ctx.fillStyle = '#E8342A';
      ctx.beginPath();
      ctx.arc(0, 2, t.r * 0.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5a9e2f';
      ctx.beginPath();
      ctx.ellipse(4, -10, 5, 3, -0.5, 0, Math.PI * 2);
      ctx.fill();
      break;
  }
  ctx.restore();
}

function drawSnail() {
  ctx.save();
  ctx.translate(snail.x, snail.y);
  ctx.rotate(snail.angle);

  ctx.fillStyle = '#B5D46E';
  ctx.beginPath();
  ctx.ellipse(0, 6, snail.r * 0.9, snail.r * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#7BA33F'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#D4A35A';
  ctx.beginPath();
  ctx.arc(0, -2, snail.r * 0.85, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 2.5; ctx.stroke();

  ctx.beginPath();
  ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 2;
  for (let a = 0; a < Math.PI * 4; a += 0.2) {
    const rr = a * 1.2;
    const px = Math.cos(a) * rr - 4;
    const py = Math.sin(a) * rr - 2;
    if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.strokeStyle = '#B5D46E'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  const eyeL = -snail.r * 0.4, eyeR = snail.r * 0.4, eyeY = -snail.r * 0.55;
  ctx.beginPath();
  ctx.moveTo(eyeL, eyeY); ctx.lineTo(eyeL - 4, eyeY - 12);
  ctx.moveTo(eyeR, eyeY); ctx.lineTo(eyeR + 4, eyeY - 12);
  ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(eyeL - 4, eyeY - 12, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(eyeR + 4, eyeY - 12, 2.5, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function render() {
  drawBackground();
  drawTrail();
  for (const t of trash) drawTrash(t);
  drawSnail();
}

// ====== ЦИКЛ ======
function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ====== ИГРА ======
function endGame() {
  running = false;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOver').classList.add('show');
}

function restart() {
  snail.x = W/2; snail.y = H/2; snail.trail = [];
  trash = []; score = 0; timeLeft = 60; running = true;
  document.getElementById('score').textContent = 0;
  document.getElementById('time').textContent = 60;
  document.getElementById('gameOver').classList.remove('show');
  for (let i = 0; i < 8; i++) spawnTrash();
}

resizeCanvas();
for (let i = 0; i < 8; i++) spawnTrash();
requestAnimationFrame(loop);
</script>
</body>
</html>
