<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐌 Улитка: Эволюция</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1a1a1a;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    user-select: none; touch-action: none;
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  
  /* Верхнее меню */
  #hud-top {
    width: 100%; max-width: 400px;
    display: flex; justify-content: space-between;
    font-size: 15px; font-weight: bold;
    padding: 10px 10px 5px 10px; box-sizing: border-box;
  }
  .hud-box {
    background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 10px;
    border: 2px solid #4a7c2a;
    white-space: nowrap;
  }
  #hud-level { color: #FFD700; }
  #hud-total-score { color: #87CEEB; }
  #hud-lives { color: #ff4a4a; font-size: 18px; }

  /* Счетчик уровня (под меню) */
  #level-target {
    width: 100%; max-width: 400px;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    color: #ccc;
    padding-bottom: 8px;
  }
  #level-target span {
    color: #fff;
    background: rgba(255,255,255,0.1);
    padding: 2px 8px;
    border-radius: 5px;
  }

  #game-area {
    display: flex; flex-direction: column; align-items: center;
  }

  canvas {
    display: block;
    background: #1e2c1e;
    border-radius: 10px;
    border: 4px solid #4a7c2a;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
  }

  #bottom-panel {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 400px;
    padding: 15px 10px;
  }

  #dpad {
    width: 140px; height: 140px;
    display: none;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 4px;
  }
  #dpad.active { display: grid; }
  .d-btn {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: #fff; touch-action: none;
  }
  .d-btn:active { background: rgba(255,255,255,0.4); }
  .d-up { grid-area: 1 / 2; }
  .d-left { grid-area: 2 / 1; }
  .d-right { grid-area: 2 / 3; }
  .d-down { grid-area: 3 / 2; }

  #minimap-container {
    width: 100px; height: 100px;
    border: 2px solid #4a7c2a;
    background: rgba(0,0,0,0.6);
    border-radius: 10px;
    display: none;
  }
  #minimap-container.active { display: block; }
  #minimap-canvas { width: 100%; height: 100%; border-radius: 8px; }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    padding: 20px;
  }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal h2 { margin: 0 0 10px; color: #FFD700; font-size: 26px; text-align: center; }
  .modal p { margin: 5px 0; font-size: 16px; text-align: center; }
  
  #shop { background: rgba(20, 30, 20, 0.95); }
  .shop-items { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 400px; margin: 15px 0; }
  .shop-item {
    background: #2a3a2a; border: 2px solid #4a7c2a; border-radius: 12px;
    padding: 12px; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: transform 0.1s;
  }
  .shop-item:active { transform: scale(0.98); }
  .shop-item.disabled { opacity: 0.5; pointer-events: none; }
  .shop-item-info { text-align: left; }
  .shop-item-title { font-weight: bold; font-size: 16px; color: #fff; }
  .shop-item-desc { font-size: 12px; color: #aaa; margin-top: 2px; }
  .shop-item-price { font-weight: bold; font-size: 16px; color: #FFD700; }
  
  button {
    padding: 12px 24px; font-size: 18px; font-weight: bold;
    background: #4a7c2a; color: white; border: none; border-radius: 12px;
    cursor: pointer; margin-top: 10px; width: 100%; max-width: 400px;
  }
  button:active { background: #5f9a37; }

  #damage-overlay {
    position: fixed; inset: 0; background: rgba(255,0,0,0.4);
    pointer-events: none; opacity: 0; z-index: 15;
  }
</style>
</head>
<body>
  <!-- Верхнее меню -->
  <div id="hud-top">
    <div class="hud-box" id="hud-level">Уровень: 1</div>
    <div class="hud-box" id="hud-total-score">Всего: 0</div>
    <div class="hud-box" id="hud-lives">❤️❤️❤️</div>
  </div>

  <!-- Счетчик уровня -->
  <div id="level-target">
    Собрано на уровне: <span id="level-progress">0 / 0</span>
  </div>

  <div id="game-area">
    <canvas id="game" width="400" height="400"></canvas>
  </div>

  <div id="bottom-panel">
    <div id="dpad">
      <div class="d-btn d-up" data-dir="up">▲</div>
      <div class="d-btn d-left" data-dir="left">◀</div>
      <div class="d-btn d-right" data-dir="right">▶</div>
      <div class="d-btn d-down" data-dir="down">▼</div>
    </div>
    <div id="minimap-container">
      <canvas id="minimap-canvas" width="100" height="100"></canvas>
    </div>
  </div>

  <div id="shop" class="modal">
    <h2>🛒 Магазин</h2>
    <p>Уровень <span id="shop-level">1</span> пройден!</p>
    <p>У тебя очков: <span id="shop-score" style="color:#FFD700; font-weight:bold;">0</span></p>
    <div class="shop-items" id="shop-items-container"></div>
    <button id="btn-next-level">Дальше ▶</button>
  </div>

  <div id="gameover" class="modal">
    <h2>💀 Игра окончена</h2>
    <p>Уровень: <span id="final-level" style="color:#FFD700;">1</span></p>
    <p>Всего мусора: <span id="final-score" style="color:#87CEEB;">0</span></p>
    <button onclick="startGame()">Заново 🔄</button>
  </div>
</div>
<div id="damage-overlay"></div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 400, H = 400;
canvas.width = W;
canvas.height = H;

const mapCanvas = document.getElementById('minimap-canvas');
const mapCtx = mapCanvas.getContext('2d');

let gameState = 'playing';
let level = 1;
let score = 0;            // Общий счет (не сбрасывается до смерти)
let levelTrash = 0;       // Собрано на текущем уровне
let totalTrash = 0;       // Сколько нужно собрать на уровне
let lives = 3;
let lastTime = 0;

let world = { w: W, h: H };
let camera = { x: 0, y: 0 };

const snail = {
  x: W/2, y: H/2, r: 12, 
  baseSpeed: 160,
  speedMult: 1.0,
  pickupMult: 1.0,
  invuln: 0,
  angle: Math.PI/2
};

let trash = [];
let enemies = [];
let particles = [];
const TRASH_TYPES = ['banana', 'can', 'bottle', 'paper', 'apple'];

const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (isTouch) document.getElementById('dpad').classList.add('active');

let keyState = { up: false, down: false, left: false, right: false };

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w' || k === 'ц') keyState.up = true;
  if (k === 'arrowdown' || k === 's' || k === 'ы') keyState.down = true;
  if (k === 'arrowleft' || k === 'a' || k === 'ф') keyState.left = true;
  if (k === 'arrowright' || k === 'd' || k === 'в') keyState.right = true;
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
});

window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w' || k === 'ц') keyState.up = false;
  if (k === 'arrowdown' || k === 's' || k === 'ы') keyState.down = false;
  if (k === 'arrowleft' || k === 'a' || k === 'ф') keyState.left = false;
  if (k === 'arrowright' || k === 'd' || k === 'в') keyState.right = false;
});

document.querySelectorAll('.d-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  const press = (e) => { e.preventDefault(); keyState[dir] = true; };
  const release = (e) => { e.preventDefault(); keyState[dir] = false; };

  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('touchend', release);
  btn.addEventListener('touchcancel', release);
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});

function spawnEntity(type) {
  let x, y, valid = false;
  let attempts = 0;
  while (!valid && attempts < 100) {
    x = 20 + Math.random() * (world.w - 40);
    y = 20 + Math.random() * (world.h - 40);
    if (Math.hypot(x - snail.x, y - snail.y) > 100) valid = true;
    attempts++;
  }

  if (type === 'trash') {
    trash.push({
      x, y, r: 8,
      type: TRASH_TYPES[Math.floor(Math.random() * TRASH_TYPES.length)],
      wobble: Math.random() * Math.PI * 2
    });
  } else {
    const speed = 60 + (level * 10);
    const angle = Math.random() * Math.PI * 2;
    enemies.push({
      x, y, r: 10,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      speed: speed
    });
  }
}

function startLevel() {
  gameState = 'playing';
  document.getElementById('shop').classList.remove('show');
  document.getElementById('gameover').classList.remove('show');
  document.getElementById('hud-level').textContent = `Уровень: ${level}`;
  
  world.w = Math.min(1500, W + (level - 1) * 150);
  world.h = Math.min(1500, H + (level - 1) * 150);

  const minimapEl = document.getElementById('minimap-container');
  if (world.w > W || world.h > H) {
    minimapEl.classList.add('active');
  } else {
    minimapEl.classList.remove('active');
  }

  snail.x = world.w / 2; 
  snail.y = world.h / 2;
  snail.invuln = 1;
  keyState = { up: false, down: false, left: false, right: false };
  
  trash = [];
  enemies = [];
  particles = [];
  
  levelTrash = 0;
  totalTrash = 6 + (level * 2);
  
  for (let i = 0; i < totalTrash; i++) spawnEntity('trash');
  
  const enemyCount = 2 + Math.floor(level * 1.2);
  for (let i = 0; i < enemyCount; i++) spawnEntity('enemy');
  
  updateHUD();
}

function updateHUD() {
  // Верхнее меню (общий счет)
  document.getElementById('hud-total-score').textContent = `Всего: ${score}`;
  
  // Счетчик уровня
  document.getElementById('level-progress').textContent = `${levelTrash} / ${totalTrash}`;
  
  // Жизни
  let hearts = '';
  for(let i=0; i<3; i++) hearts += (i < lives) ? '❤️' : '🖤';
  document.getElementById('hud-lives').innerHTML = hearts;
}

const shopItems = [
  { id: 'speed', title: '⚡ Скорость', desc: '+15% к скорости', basePrice: 5, priceMult: 1.5 },
  { id: 'magnet', title: '🧲 Магнит', desc: 'Сбор на расстоянии', basePrice: 8, priceMult: 1.5 },
  { id: 'life', title: '❤️ Жизнь', desc: '+1 жизнь', basePrice: 10, priceMult: 2.0 },
  { id: 'freeze', title: '❄️ Заморозка', desc: 'Враги медленнее', basePrice: 6, priceMult: 1.5 }
];

function showShop() {
  gameState = 'shop';
  document.getElementById('shop-level').textContent = level;
  document.getElementById('shop-score').textContent = score;
  
  const container = document.getElementById('shop-items-container');
  container.innerHTML = '';
  
  shopItems.forEach(item => {
    let price = Math.floor(item.basePrice * Math.pow(item.priceMult, level - 1));
    const btn = document.createElement('div');
    btn.className = 'shop-item' + (score < price ? ' disabled' : '');
    btn.innerHTML = `
      <div class="shop-item-info">
        <div class="shop-item-title">${item.title}</div>
        <div class="shop-item-desc">${item.desc}</div>
      </div>
      <div class="shop-item-price">${price} 🗑️</div>
    `;
    
    btn.onclick = () => {
      if (score >= price) {
        score -= price;
        updateHUD();
        if (item.id === 'speed') snail.speedMult += 0.15;
        if (item.id === 'magnet') snail.pickupMult += 0.3;
        if (item.id === 'life') { if(lives < 5) lives++; }
        if (item.id === 'freeze') { enemies.forEach(e => { e.speed *= 0.8; e.vx *= 0.8; e.vy *= 0.8; }); }
        showShop();
      }
    };
    container.appendChild(btn);
  });
}

document.getElementById('btn-next-level').onclick = () => {
  level++;
  startLevel();
};

function update(dt) {
  if (gameState !== 'playing') return;

  let dx = 0, dy = 0;
  if (keyState.up) dy -= 1;
  if (keyState.down) dy += 1;
  if (keyState.left) dx -= 1;
  if (keyState.right) dx += 1;

  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    dx /= len;
    dy /= len;
    snail.angle = Math.atan2(dy, dx) + Math.PI/2;
    const speed = snail.baseSpeed * snail.speedMult;
    snail.x += dx * speed * dt;
    snail.y += dy * speed * dt;
  }

  if (snail.x < snail.r) snail.x = snail.r;
  if (snail.x > world.w - snail.r) snail.x = world.w - snail.r;
  if (snail.y < snail.r) snail.y = snail.r;
  if (snail.y > world.h - snail.r) snail.y = world.h - snail.r;

  camera.x = snail.x - W / 2;
  camera.y = snail.y - H / 2;
  camera.x = Math.max(0, Math.min(world.w - W, camera.x));
  camera.y = Math.max(0, Math.min(world.h - H, camera.y));

  if (snail.invuln > 0) snail.invuln -= dt;

  for (let i = trash.length - 1; i >= 0; i--) {
    const t = trash[i];
    t.wobble += dt * 5;
    
    const pickupRadius = (snail.r + t.r) * (1 + snail.pickupMult);
    if (Math.hypot(t.x - snail.x, t.y - snail.y) < pickupRadius) {
      trash.splice(i, 1);
      score++;
      levelTrash++;
      updateHUD();
      for(let p=0; p<5; p++) particles.push({ x: t.x, y: t.y, vx: (Math.random()-0.5)*150, vy: (Math.random()-0.5)*150, life: 1, color: '#fff' });
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.x += e.vx * dt;
    e.y += e.vy * dt;

    if (e.x < e.r || e.x > world.w - e.r) e.vx *= -1;
    if (e.y < e.r || e.y > world.h - e.r) e.vy *= -1;
    e.x = Math.max(e.r, Math.min(world.w - e.r, e.x));
    e.y = Math.max(e.r, Math.min(world.h - e.r, e.y));

    if (snail.invuln <= 0 && Math.hypot(e.x - snail.x, e.y - snail.y) < e.r + snail.r) {
      lives--;
      snail.invuln = 2.0;
      updateHUD();

      const overlay = document.getElementById('damage-overlay');
      overlay.style.transition = 'none';
      overlay.style.opacity = '1';
      setTimeout(() => { overlay.style.transition = 'opacity 0.5s'; overlay.style.opacity = '0'; }, 50);

      e.vx = (snail.x - e.x) * 4;
      e.vy = (snail.y - e.y) * 4;
      for(let p=0; p<10; p++) particles.push({ x: snail.x, y: snail.y, vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200, life: 1, color: '#ff4a4a' });

      if (lives <= 0) {
        gameState = 'gameover';
        document.getElementById('final-level').textContent = level;
        document.getElementById('final-score').textContent = score;
        document.getElementById('gameover').classList.add('show');
        return;
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  if (gameState === 'playing' && levelTrash >= totalTrash) {
    showShop();
  }
}

function draw() {
  ctx.fillStyle = '#1e2c1e';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= world.w; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, world.h); ctx.stroke();
  }
  for (let y = 0; y <= world.h; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(world.w, y); ctx.stroke();
  }

  ctx.strokeStyle = '#ff4a4a';
  ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, world.w, world.h);

  for (const t of trash) {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(Math.sin(t.wobble) * 0.2);
    if (t.type === 'banana') { ctx.fillStyle = '#FFD93B'; ctx.beginPath(); ctx.arc(0, 0, t.r, 0.2, Math.PI - 0.2); ctx.fill(); } 
    else if (t.type === 'can') { ctx.fillStyle = '#C0C0C0'; ctx.fillRect(-t.r*0.7, -t.r, t.r*1.4, t.r*2); } 
    else if (t.type === 'bottle') { ctx.fillStyle = 'rgba(100, 200, 150, 0.9)'; ctx.fillRect(-t.r*0.5, -t.r, t.r, t.r*2); } 
    else if (t.type === 'paper') { ctx.fillStyle = '#F5F5DC'; ctx.fillRect(-t.r, -t.r, t.r*2, t.r*1.5); } 
    else if (t.type === 'apple') { ctx.fillStyle = '#E8342A'; ctx.beginPath(); ctx.arc(0, 0, t.r*0.8, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }

  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = '#ff4a4a';
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-3, -3, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -3, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-3, -3, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -3, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(snail.x, snail.y);
  
  if (snail.invuln > 0 && Math.floor(Date.now() / 100) % 2 === 0) {
    ctx.globalAlpha = 0.3;
  }

  ctx.rotate(snail.angle);
  
  ctx.fillStyle = '#B5D46E';
  ctx.beginPath(); ctx.ellipse(0, 0, snail.r, snail.r*0.8, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#D4A35A';
  ctx.beginPath(); ctx.arc(0, 2, snail.r*0.8, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#B5D46E';
  ctx.beginPath(); ctx.arc(-4, -snail.r*0.8, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -snail.r*0.8, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-4, -snail.r*0.8 - 1, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -snail.r*0.8 - 1, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2 * p.life, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawMinimap();
}

function drawMinimap() {
  const mapEl = document.getElementById('minimap-container');
  if (!mapEl.classList.contains('active')) return;

  mapCtx.clearRect(0, 0, 100, 100);
  
  const scaleX = 100 / world.w;
  const scaleY = 100 / world.h;

  mapCtx.fillStyle = '#fff';
  for (const t of trash) {
    mapCtx.fillRect(t.x * scaleX, t.y * scaleY, 2, 2);
  }

  mapCtx.fillStyle = '#ff4a4a';
  for (const e of enemies) {
    mapCtx.beginPath();
    mapCtx.arc(e.x * scaleX, e.y * scaleY, 3, 0, Math.PI*2);
    mapCtx.fill();
  }

  mapCtx.fillStyle = '#87CEEB';
  mapCtx.beginPath();
  mapCtx.arc(snail.x * scaleX, snail.y * scaleY, 4, 0, Math.PI*2);
  mapCtx.fill();
}

function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function startGame() {
  level = 1;
  score = 0;
  lives = 3;
  snail.speedMult = 1.0;
  snail.pickupMult = 1.0;
  startLevel();
}

startGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
